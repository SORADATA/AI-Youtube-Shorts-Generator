name: Publisher [Bot]

on:
  workflow_dispatch:

jobs:
  publier_video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ACTIVER_FINANCE: "false"
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4
        
      - name: 🐍 Configurer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"
          
      - name: ⚙️ Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
        
      - name: 📦 Installer les dépendances minimales
        run: pip install requests
        
      - name: 🚀 Lancer les scripts de publication
        env:
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          TIKTOK_ACCOUNT_ID: ${{ secrets.TIKTOK_ACCOUNT_ID }}
          YOUTUBE_ACCOUNT_ID: ${{ secrets.YOUTUBE_ACCOUNT_ID }}
          ZERNIO_API_KEYS_FINANCE: ${{ secrets.ZERNIO_API_KEYS_FINANCE }}
          TIKTOK_CAPITAL_SIMPLE_ID: ${{ secrets.TIKTOK_CAPITAL_SIMPLE_ID }}
          YOUTUBE_CAPITAL_SIMPLE_ID: ${{ secrets.YOUTUBE_CAPITAL_SIMPLE_ID }}
        run: |
          # 1. On lance toujours le premier script
          python publish.py
          mv loudness_report.txt loudness_report_standard.txt || true
          
          # 2. On lance publish_finance.py uniquement si la variable d'environnement est à "true"
          if [ "$ACTIVER_FINANCE" = "true" ]; then
            echo "Lancement de publish_finance.py..."
            python publish_finance.py
            mv loudness_report.txt loudness_report_finance.txt || true
          else
            echo "publish_finance.py ignoré (désactivé par configuration)."
          fi

      - name: 💾 Sauvegarder les rapports de loudness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Reports-Publish-${{ github.run_id }}
          path: loudness_report_*.txt 
          if-no-files-found: ignore
