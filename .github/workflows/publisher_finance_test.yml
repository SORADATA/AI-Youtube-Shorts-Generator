name: Publisher finance [test]

on:
  workflow_dispatch:

jobs:
  publier_video:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v7

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: ⚙️ Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: 📦 Installer les dépendances minimales
        run: pip install requests

      - name: 🚀 Lancer le script de publication
        env:
          ZERNIO_API_KEYS_FINANCE: ${{ secrets.ZERNIO_API_KEYS_FINANCE }}
          TIKTOK_CAPITAL_SIMPLE_ID: ${{ secrets.TIKTOK_CAPITAL_SIMPLE_ID }}
          YOUTUBE_CAPITAL_SIMPLE_ID: ${{ secrets.YOUTUBE_CAPITAL_SIMPLE_ID }}
        run: python publish_finance.py

      - name: 💾 Sauvegarder le rapport de loudness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-Publish-${{ github.run_id }}
          path: loudness_report.txt
          if-no-files-found: ignore
