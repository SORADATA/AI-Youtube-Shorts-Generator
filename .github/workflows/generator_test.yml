name: Générateur de Vidéos IA [test]

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet de la vidéo (laisser vide pour choix automatique par l'IA)"
        required: false
        default: ""
      duration:
        description: "Durée souhaitée en secondes (20 à 90)"
        required: false
        default: "45"
      refine_angle:
        description: "Laisser l'IA reformuler l'angle du sujet"
        required: false
        default: "true"
      use_hook_variants:
        description: "Tester plusieurs hooks avant génération"
        required: false
        default: "true"

permissions:
  contents: write   # Nécessaire pour committer l'état du curriculum en fin de run

jobs:
  build-and-generate:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZERNIO_API_KEYS_FINANCE: ${{ secrets.ZERNIO_API_KEYS_FINANCE }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}

      VIDEO_TOPIC: ${{ github.event.inputs.topic || '' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}
      REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      USE_HOOK_VARIANTS: ${{ github.event.inputs.use_hook_variants || 'true' }}

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Installer FFmpeg et espeak-ng (requis par kokoro TTS)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: 🎙️ Installer whisper.cpp (pour sous-titres karaoké)
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          bash ./models/download-ggml-model.sh base
          make -j

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: "pip"

      - name: 🗃️ Cache Hugging Face
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-kokoro-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-kokoro-

      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      - name: 🎬 Générer la vidéo (Finance)
        run: |
          for i in 1 2 3; do
            echo "Tentative $i..."
            python main_finance.py && exit 0
            echo "Échec de la tentative $i. Pause de 15 secondes avant de réessayer..."
            sleep 15
          done
          echo "Les 3 tentatives ont échoué."
          exit 1

      - name: 🔊 Vérifier le niveau sonore
        if: always()
        run: |
          if [ -f assets/final/final_short.mp4 ]; then
            ffmpeg -i assets/final/final_short.mp4 -af loudnorm=print_format=summary -f null - 2>&1 | tee loudness_report.txt
          else
            echo "Aucune vidéo finale trouvée." | tee loudness_report.txt
          fi

      - name: 💾 Sauvegarder le rapport de loudness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-${{ github.run_id }}
          path: loudness_report.txt
          if-no-files-found: warn

      - name: 💾 Sauvegarder la vidéo finale
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-TikTok-Prete-${{ github.run_id }}
          path: assets/final/final_short.mp4
          if-no-files-found: warn

      - name: 💾 Sauvegarder la légende
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Texte-Finance-${{ github.run_id }}
          path: caption.txt
          if-no-files-found: warn

      - name: 🧠 Committer l'état du curriculum (anti-répétition)
        if: always()
        run: |
          if [ -f assets/state/curriculum_finance_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/state/curriculum_finance_state.json
            git diff --staged --quiet || git commit -m "chore: mise a jour de l'etat du curriculum [skip ci]"
            git push
          else
            echo "Aucun fichier d'etat du curriculum a committer."
          fi
