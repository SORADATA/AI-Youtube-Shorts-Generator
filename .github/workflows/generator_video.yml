name: Générateurs de Vidéos IA

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Sujet de la vidéo (laisser vide pour choix automatique par l'IA)"
        required: false
        default: ""
      duration:
        description: "Durée souhaitée en secondes (20 à 90)"
        required: false
        default: "45"
      refine_angle:
        description: "Laisser l'IA reformuler l'angle du sujet"
        required: false
        default: "true"
      use_hook_variants:
        description: "Tester plusieurs hooks avant génération"
        required: false
        default: "true"
  repository_dispatch:
    types: [trigger-videos]

jobs:
  finance_generator:
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZERNIO_API_KEYS_FINANCE: ${{ secrets.ZERNIO_API_KEYS_FINANCE }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      VIDEO_TOPIC: ${{ github.event.inputs.topic || '' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}
      REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      USE_HOOK_VARIANTS: ${{ github.event.inputs.use_hook_variants || 'true' }}
      POLLINATIONS_TOKEN: ${{ secrets.POLLINATIONS_TOKEN }}
      # (utilise par AssetManager / ContentBrain pour Wikidata/Wikipedia)
      WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # CORRECTIF : installation explicite de la police grasse utilisee
      # par le watermark banner dans Composer.add_watermark_text()
      # (fontfile="/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf").
      # Sans cette etape, ffmpeg leve une erreur "Cannot open font file"
      # et le watermark est silencieusement absent de la video finale.
      - name: 🔤 Installer la police pour le watermark (DejaVu Bold)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: 🎙️ Install whisper.cpp
        run: |
          git clone https://github.com/ggerganov/whisper.cpp.git
          cd whisper.cpp
          bash ./models/download-ggml-model.sh base
          make -j

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: 🗃️ Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-kokoro-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-kokoro-

      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      - name: 🎬 Générer la vidéo (Finance)
        run: |
          for i in 1 2 3; do
            echo "Tentative $i..."
            python main_finance.py && exit 0
            echo "Échec de la tentative $i. Pause de 15 secondes avant de réessayer..."
            sleep 15
          done
          echo "Les 3 tentatives ont échoué."
          exit 1

      - name: 🔊 Vérifier le niveau sonore
        if: always()
        run: |
          if [ -f assets/final/final_short.mp4 ]; then
            ffmpeg -i assets/final/final_short.mp4 -af loudnorm=print_format=summary -f null - 2>&1 | tee loudness_finance.txt
          else
            echo "Aucune vidéo finale trouvée." | tee loudness_finance.txt
          fi

      - name: 💾 Sauvegarder le rapport (Finance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-Finance-${{ github.run_id }}
          path: loudness_finance.txt
          if-no-files-found: warn

      - name: 💾 Sauvegarder la vidéo (Finance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-TikTok-Finance-${{ github.run_id }}
          path: assets/final/final_short.mp4
          if-no-files-found: warn

      - name: 💾 Sauvegarder la légende (Finance)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Texte-Finance-${{ github.run_id }}
          path: caption.txt
          if-no-files-found: warn

  mystere_generator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      VIDEO_TOPIC: ${{ github.event.inputs.topic || '' }}
      VIDEO_DURATION: ${{ github.event.inputs.duration || '45' }}
      REFINE_ANGLE: ${{ github.event.inputs.refine_angle || 'true' }}
      USE_HOOK_VARIANTS: ${{ github.event.inputs.use_hook_variants || 'true' }}
      # CORRECTIF : contact requis par la politique User-Agent Wikimedia
      # (utilise par AssetManager / ContentBrain pour Wikidata/Wikipedia)
      WIKIMEDIA_CONTACT: ${{ secrets.WIKIMEDIA_CONTACT }}

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4

      - name: ⚙️ Installer FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # CORRECTIF : meme raison que ci-dessus, necessaire pour le
      # watermark banner "@MinuteMystere" en haut de la video.
      - name: 🔤 Installer la police pour le watermark (DejaVu Bold)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: 🐍 Configurer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: "pip"

      - name: 🗃️ Cache Hugging Face
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-huggingface-kokoro-v1
          restore-keys: |
            ${{ runner.os }}-huggingface-kokoro-

      - name: 📦 Installer les dépendances
        run: pip install -r requirements.txt

      - name: 🎬 Générer la vidéo (Minute Mystere)
        run: |
          for i in 1 2 3; do
            echo "Tentative $i..."
            python main.py && exit 0
            echo "Échec de la tentative $i. Pause de 15 secondes avant de réessayer..."
            sleep 15
          done
          echo "Les 3 tentatives ont échoué."
          exit 1

      - name: 🔊 Vérifier le niveau sonore
        if: always()
        run: |
          if [ -f assets/final/final_short.mp4 ]; then
            ffmpeg -i assets/final/final_short.mp4 -af loudnorm=print_format=summary -f null - 2>&1 | tee loudness_general.txt
          else
            echo "Aucune vidéo finale trouvée." | tee loudness_general.txt
          fi

      - name: 💾 Sauvegarder le rapport (Minute Mystere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Loudness-Report-Minute Mystere-${{ github.run_id }}
          path: loudness_general.txt
          if-no-files-found: warn

      - name: 💾 Sauvegarder la vidéo (Minute Mystere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Video-TikTok-MinuteMystere-${{ github.run_id }}
          path: assets/final/final_short.mp4
          if-no-files-found: warn

      - name: 💾 Sauvegarder la légende (Minute Mystere)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Caption-Texte-MinuteMystere-${{ github.run_id }}
          path: caption.txt
          if-no-files-found: warn
